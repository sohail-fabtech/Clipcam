<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Default first: older iOS ignores media on theme-color and otherwise
         falls back to white chrome behind a hung splash. -->
    <meta name="theme-color" content="#0B0D10" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E6E8EB" />
    <!-- iOS home-screen apps only draw under the status bar when asked:
         black-translucent makes the web view truly full screen (the page
         background paints behind the clock instead of an opaque system
         strip). Content clearance comes from the --safe-top padding that
         every top-anchored element already uses. Status bar text follows
         the system light/dark mode, which matches our color-scheme theming. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clipcam" />
    <meta
      name="description"
      content="Clipcam — hold anywhere to record clips. Privacy-first camera for the web. Free, no watermark."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clipcam" />
    <meta property="og:title" content="Clipcam — hold to record, tap Go to share" />
    <meta
      property="og:description"
      content="A private, on-device clips camera for the web. Record shot by shot, trim on a filmstrip, export one video. Free & open source."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clipcam — hold to record, tap Go to share" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clipcam — hold to record, tap Go to share" />
    <meta
      name="twitter:description"
      content="A private, on-device clips camera for the web. Free & open source."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Clipcam",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Sohail Khan", "url": "https://me.jscrate.dev" },
        "description": "A private, on-device clips camera for the web. Record shot by shot, trim on a filmstrip, export one video. Free and open source, every feature included. No accounts, no clip uploads, no watermark."
      }
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      href="/logo.svg"
      type="image/svg+xml"
      fetchpriority="high"
      media="not (display-mode: standalone)"
    />
    <!-- Critical first-paint styles for the permanent boot hero. Lives outside
         #app so SPA boot cannot destroy it; that was lantern's multi-second
         LCP "render delay" when the hero was re-created by JS. -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1215;
        --ink: #f2f3f5;
        --ink-muted: #9aa0a7;
        --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif-condensed, sans-serif;
        --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #e6e8eb;
          --ink: #0b0d10;
          --ink-muted: #565c63;
        }
      }
      /* Must match global.css from first paint — otherwise the desktop
         phone frame reflows when border-box arrives (large CLS). */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        /* Reserve scrollbar space so desktop overflow:auto cannot shift the
           centered #root when the SPA paints taller content. */
        scrollbar-gutter: stable;
        /* Solid color first so a standalone launch never shows the UA
           default white page while assets settle. */
        background-color: #0f1215;
      }
      html,
      body,
      #root,
      #app {
        margin: 0;
        min-height: 100%;
        height: 100%;
      }
      #root {
        width: min(480px, 100%);
      }
      body {
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #e6e8eb;
        }
      }
      #root {
        position: relative;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      /* Below #app (z-index 1) so in-app overlays (e.g. the update toast)
         can paint above the LCP brand. Transparent #app regions still let
         this hero show through on the home route. */
      #boot-hero {
        position: absolute;
        top: calc(12px + var(--safe-top));
        left: 0;
        right: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 2px;
        pointer-events: none;
      }
      #boot-hero .brand-hero-art {
        width: 96px;
        height: 96px;
        margin: 0 0 4px;
        border-radius: 22%;
        display: block;
      }
      #boot-hero .brand {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        font-size: clamp(2.1rem, 9vw, 2.6rem);
        line-height: 0.9;
        margin: 0;
      }
      #boot-hero .lede {
        margin: 6px 0 0;
        color: var(--ink-muted);
        font-family: var(--font-mono);
        font-stretch: 78%;
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        line-height: 1.3;
      }
      @media (max-height: 720px) {
        #boot-hero .brand-hero-art {
          width: 72px;
          height: 72px;
        }
        #boot-hero .brand {
          font-size: 1.9rem;
        }
        #boot-hero .lede {
          font-size: 0.6rem;
        }
      }
      /* Hide the HTML boot hero only once a route has painted real chrome.
         data-route=app used to flip at navigation time and left a blank
         #app over a hidden hero (installed PWAs looked empty while the
         lazy chunk and IndexedDB caught up). */
      html:has(.project-screen) #boot-hero,
      html:has(.about-screen) #boot-hero {
        display: none;
      }
      /* Landscape viewports (turned phones, desktop-ish windows): the SPA
         paints the hero inside its two-pane home layout — the top-centered
         boot hero would sit in the wrong place. */
      @media (orientation: landscape) {
        #boot-hero {
          display: none;
        }
      }
      /* Shell width by layout mode — must mirror global.css (the attribute
         is set by the pre-paint script below, so the frame never jumps when
         the full stylesheet arrives). 'adaptive' (home/static pages) widens
         on landscape viewports; 'wide' (landscape projects) always;
         'narrow' (portrait projects) widens when the viewport is landscape
         so chrome can use the side gutters. */
      html[data-shell='wide'] #root,
      html[data-shell='wide'] .app-shell {
        width: 100%;
        max-width: none;
      }
      @media (orientation: landscape) {
        html[data-shell='adaptive'] #root,
        html[data-shell='adaptive'] .app-shell,
        html[data-shell='narrow'] #root,
        html[data-shell='narrow'] .app-shell {
          width: 100%;
          max-width: none;
        }
      }
      @media (min-width: 720px) and (orientation: landscape) and (pointer: fine) {
        html[data-shell='adaptive'] #root,
        html[data-shell='wide'] #root,
        html[data-shell='narrow'] #root {
          width: min(1200px, calc(100% - 48px));
        }
      }
      /* Desktop: SPA paints the hero. Reserve the phone-chrome frame here so
         applying the full stylesheet does not shift the whole page (CLS).
         Fine pointers only — a phone turned sideways is also ≥720px wide,
         and held devices must stay full-bleed (match global.css). */
      @media (min-width: 720px) and (pointer: fine) {
        body {
          overflow: auto;
          /* Must match global.css: BFC keeps #root margins from collapsing
             through the 100%-tall body (phantom scroll below the fold). */
          display: flow-root;
        }
        #boot-hero {
          display: none;
        }
        #root {
          margin-top: 24px;
          margin-bottom: 24px;
          height: min(920px, calc(100dvh - 48px));
          /* Must match global.css: without this the base min-height: 100%
             wins and the frame's bottom edge falls below the fold. */
          min-height: 0;
          border-radius: 14px;
          /* Match full stylesheet: reserve border box so 1px border + shadow
             cannot reflow the frame after CSS arrives. */
          border: 1px solid rgba(242, 243, 245, 0.14);
          overflow: hidden;
        }
      }
      @media (min-width: 720px) and (pointer: fine) and (prefers-color-scheme: light) {
        #root {
          border-color: rgba(11, 13, 16, 0.14);
        }
      }
      #app {
        position: relative;
        z-index: 1;
      }
    </style>
    <script>
      // Pre-paint shell layout: home and static pages adapt to landscape
      // viewports; project pages start on the narrow phone column and widen
      // once the app knows the project is landscape-locked. Runs before
      // first paint so the frame never jumps; main.tsx keeps it synced on
      // navigation (must match syncRouteChrome there).
      document.documentElement.dataset.shell = location.pathname.startsWith('/project/')
        ? 'narrow'
        : 'adaptive'
    </script>
    <script>
      // Fathom Analytics (cookieless, anonymous page-view counts). Loaded
      // only on real deployments so dev servers and test runs stay out of
      // the stats; data-spa covers client-side route changes.
      if (['kody.video', 'kody-video.pages.dev'].includes(location.hostname)) {
        var fathomScript = document.createElement('script')
        fathomScript.src = 'https://cdn.usefathom.com/script.js'
        fathomScript.setAttribute('data-site', 'YKYNNRMZ')
        fathomScript.setAttribute('data-spa', 'auto')
        fathomScript.defer = true
        document.head.appendChild(fathomScript)
      }
    </script>
    <title>Clipcam</title>
  </head>
  <body>
    <div id="root">
      <header id="boot-hero">
        <img
          class="brand-hero-art"
          width="96"
          height="96"
          src="/logo.svg"
          alt=""
          decoding="sync"
          fetchpriority="high"
        />
        <h1 class="brand">Clipcam</h1>
        <p class="lede">Hold to record · Tap Go to share</p>
      </header>
      <!-- Single main landmark for screen readers (and Lighthouse a11y). -->
      <main id="app"></main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
